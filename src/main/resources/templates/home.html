<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>StageTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/modal-stage :: modalStage}"></div>

<main class="main-content">

    <!-- ===== STATISTIQUES ===== -->
    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-icon icon-green">
                <!-- icône valise -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="2" y="7" width="20" height="14" rx="2"/>
                    <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                </svg>
            </div>
            <div>
                <!-- th:text="${#lists.size(stages)}" → compte le nombre de stages -->
                <div class="stat-number" th:text="${#lists.size(stages)}">0</div>
                <div class="stat-label">Stages</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon icon-blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
            </div>
            <div>
                <div class="stat-number">0</div>
                <div class="stat-label">En cours</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon icon-orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
            </div>
            <div>
                <div class="stat-number">0</div>
                <div class="stat-label">Notes</div>
            </div>
        </div>

    </div>

    <!-- ===== LISTE DES STAGES ===== -->
    <div class="section">
        <h2 class="section-title">Mes stages</h2>

        <!--
            th:if="${#lists.isEmpty(stages)}"
            → affiche ce bloc SEULEMENT si la liste est vide
        -->
        <div class="empty-state" th:if="${#lists.isEmpty(stages)}">
            <p class="empty-title">Aucun stage pour le moment</p>
            <p class="empty-subtitle">Créez votre premier stage pour commencer le suivi</p>
        </div>

        <!--
            th:unless="${#lists.isEmpty(stages)}"
            → affiche ce bloc SEULEMENT si la liste N'EST PAS vide
        -->
        <div class="stages-list" th:unless="${#lists.isEmpty(stages)}">

            <!--
                th:each="stage : ${stages}"
                → boucle sur chaque stage de la liste
                → comme un "for" en Java
            -->
            <div class="stage-card" th:each="stage : ${stages}">

                <div class="stage-card-header">
                    <div>
                        <h3 class="stage-entreprise" th:text="${stage.titre}">Titre</h3>
                        <p class="stage-poste" th:text="${stage.entreprise.nomEntreprise}">Entreprise</p>
                    </div>
                    <span class="stage-badge" th:text="${stage.statut}">Statut</span>
                </div>

                <div class="stage-card-body">
                    <p class="stage-encadrant" th:if="${stage.maitreStage != null}"
                       th:text="${stage.maitreStage.nom + ' ' + stage.maitreStage.prenom}">
                        Maître de stage
                    </p>

                    <p class="stage-dates"
                       th:if="${stage.dateDebut != null}"
                       th:text="${#temporals.format(stage.dateDebut, 'dd MMM yyyy')}
                + ' — ' +
                ${#temporals.format(stage.dateFin, 'dd MMM yyyy')}">
                        Dates
                    </p>
                </div>

            </div>

        </div>
    </div>

</main>

</body>
</html>
