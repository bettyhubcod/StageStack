<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<div class="modal-overlay" id="modal" th:fragment="modalStage">
    <div class="modal">

        <div class="modal-header">
            <h2>Créer un stage</h2>
            <button class="close-btn"
                    onclick="document.getElementById('modal').classList.remove('active')">✕</button>
        </div>

        <form action="/stages/creer" method="post" th:object="${stageDTO}">

            <div class="form-group">
                <label>Titre du stage</label>
                <input type="text" th:field="*{titre}" placeholder="Ex: Stage développeur web">
            </div>

            <div class="form-group">
                <label>Poste</label>
                <input type="text" th:field="*{poste}" placeholder="Votre poste">
            </div>

            <div class="form-group">
                <label>Entreprise</label>
                <select th:field="*{entrepriseId}">
                    <option value="">-- Choisir une entreprise --</option>
                    <option th:each="e : ${entreprises}"
                            th:value="${e.id}"
                            th:text="${e.nomEntreprise}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Maître de stage</label>
                <select th:field="*{maitreStageId}">
                    <option value="">-- Choisir un maître de stage (optionnel) --</option>
                    <option th:each="m : ${maitresStage}"
                            th:value="${m.id}"
                            th:text="${m.nom + ' ' + m.prenom}">
                    </option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date de début</label>
                    <input type="date" th:field="*{dateDebut}">
                </div>
                <div class="form-group">
                    <label>Date de fin</label>
                    <input type="date" th:field="*{dateFin}">
                </div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" placeholder="Décrivez votre stage..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Créer le stage</button>
        </form>

    </div>
</div>

</body>
</html>
